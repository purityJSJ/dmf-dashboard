<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>원료의약품등록(DMF) 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --border: #E7E9EE;
    --ink: #1F2430;
    --muted: #767C8C;
    --accent: #2F9E63;
    --accent-soft: #E4F5EC;

    --c1: #E2574C; /* 국가 1 */
    --c2: #D9A441; /* 국가 2 */
    --c3: #4C6FE0; /* 국가 3 */
    --c4: #34A0A4; /* 국가 4 */
    --c5: #6DBE68; /* 국가 5 */
    --cx: #C7CBD6; /* 기타 */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  .page-header {
    border-bottom: 3px double var(--ink);
    padding-bottom: 18px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }

  .page-header .title-block h1 {
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 900;
    font-size: 26px;
    margin: 0 0 6px;
  }

  .page-header .title-block p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    font-family: "Noto Sans KR", sans-serif;
  }

  .stamp {
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
    transform: rotate(-3deg);
  }

  .top-meta {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .top-meta b { color: var(--ink); font-weight: 700; }

  .filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pill:hover { border-color: var(--accent); color: var(--ink); }

  .pill.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }

  .right-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }

  .right-meta b { color: var(--ink); }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
  }

  .card-head h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
  }

  .card-head span {
    font-size: 12px;
    color: var(--muted);
  }

  /* 도넛 카드 */
  .donut-row {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .donut-center-label {
    font-size: 26px;
    font-weight: 900;
  }

  .donut-center-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .legend {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    font-size: 14px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 8px;
    flex-shrink: 0;
  }

  .legend-name { flex: 1; }
  .legend-count { font-weight: 700; margin-right: 8px; }
  .legend-pct { color: var(--muted); font-size: 12px; width: 42px; text-align: right; }

  /* 연도별 막대 카드 */
  .year-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  .year-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .year-label {
    width: 48px;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .year-bar-track {
    flex: 1;
    height: 10px;
    background: #EEF0F4;
    border-radius: 999px;
    overflow: hidden;
    display: flex;
  }

  .year-bar-seg { height: 100%; }

  .year-count {
    width: 48px;
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .year-legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  .year-legend span { display: inline-flex; align-items: center; }

  /* 하단 통계 카드 */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
  }

  .stat-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat-icon {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .stat-label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stat-value { font-size: 28px; font-weight: 900; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat-sub.up { color: var(--accent); font-weight: 700; }

  /* 목록 카드 */
  .list-card { padding: 22px; }

  .toolbar { margin-bottom: 14px; }

  .toolbar input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    font-family: "Noto Sans KR", sans-serif;
    font-size: 14px;
  }

  .toolbar input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row-count { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

  .table-wrap {
    max-height: 480px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead th {
    text-align: left;
    font-weight: 700;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #FAFBFC;
    position: sticky;
    top: 0;
    color: var(--muted);
    font-size: 12px;
  }

  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FAFBFC; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 760px) {
    .grid-2 { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .donut-row { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <div class="title-block">
        <h1>원료의약품등록(DMF) 현황</h1>
        <p>식품의약품안전처 공공데이터 · 매일 오전 9시 자동 갱신</p>
      </div>
      <div class="stamp">DMF REGISTRY</div>
    </header>

    <div class="top-meta">
      <span id="updated-line">불러오는 중...</span>
    </div>

    <div class="filter-row">
      <div class="pills" id="pills"></div>
      <div class="right-meta">
        <span>누적 <b id="right-total">-</b>건</span>
        <button class="refresh-btn" onclick="location.reload()">⟳ 새로고침</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head">
          <h2>제조국가 구성</h2>
          <span id="donut-range">전체 기간</span>
        </div>
        <div class="donut-row">
          <svg id="donut" width="150" height="150" viewBox="0 0 150 150"></svg>
          <div class="legend" id="legend"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>연도별 등록 건수</h2>
          <span id="year-range">최근 연도부터</span>
        </div>
        <div class="year-sub">발급일자 기준 · 국가 구성 색상과 동일</div>
        <div id="year-list"></div>
      </div>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head">
          <h2>등록업체 상위 10</h2>
          <span>전체 등록 대비 비중</span>
        </div>
        <div class="donut-row">
          <svg id="donut-company" width="150" height="150" viewBox="0 0 150 150"></svg>
          <div class="legend" id="legend-company"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>제조국가 상위 10</h2>
          <span>전체 등록 대비 비중</span>
        </div>
        <div class="donut-row">
          <svg id="donut-country10" width="150" height="150" viewBox="0 0 150 150"></svg>
          <div class="legend" id="legend-country10"></div>
        </div>
      </div>
    </div>

    <div class="card list-card">
      <div class="card-head">
        <h2>등록 목록</h2>
        <span id="row-count-top"></span>
      </div>
      <div class="toolbar">
        <input type="text" id="search" placeholder="성분명, 업체명, 제조국가로 검색" />
      </div>
      <div class="row-count" id="row-count"></div>
      <div class="table-wrap">
        <table id="data-table">
          <thead>
            <tr>
              <th>등록번호</th>
              <th>성분명</th>
              <th>업체명</th>
              <th>제조국가</th>
              <th>발급일자</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <footer>출처: 공공데이터포털 · 식품의약품안전처_원료의약품등록(DMF)현황 오픈API</footer>
  </div>

<script>
  const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
  const COLOR_HEX = ["#E2574C", "#D9A441", "#4C6FE0", "#34A0A4", "#6DBE68"];
  const OTHER_HEX = "#C7CBD6";

  let allItems = [];
  let activeCountry = "전체";

  function fmtNum(n) { return new Intl.NumberFormat("ko-KR").format(n ?? 0); }
  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function getYear(dateStr) {
    if (!dateStr) return null;
    const digits = String(dateStr).replace(/[^0-9]/g, "");
    if (digits.length >= 4) return digits.slice(0, 4);
    return null;
  }

  const RANK_COLORS = [
    "#E2574C", "#D9A441", "#4C6FE0", "#34A0A4", "#6DBE68",
    "#9B59B6", "#F2994A", "#2D9CDB", "#EB5757", "#219653",
  ];

  function renderRankDonut(svgId, legendId, rankList, totalCount, colors) {
    const top = rankList.slice(0, 10);
    const topSum = top.reduce((s, c) => s + c.count, 0);
    const otherCount = Math.max(totalCount - topSum, 0);

    const segments = top.map((c, i) => ({ name: c.name, count: c.count, color: colors[i % colors.length] }));
    if (otherCount > 0) segments.push({ name: "기타", count: otherCount, color: "#C7CBD6" });

    const svg = document.getElementById(svgId);
    const R = 60, CX = 75, CY = 75, STROKE = 18;
    const circumference = 2 * Math.PI * R;
    let offset = 0;
    let svgContent = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#EEF0F4" stroke-width="${STROKE}" />`;

    segments.forEach((seg) => {
      const frac = totalCount > 0 ? seg.count / totalCount : 0;
      const len = frac * circumference;
      svgContent += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${seg.color}" stroke-width="${STROKE}"
        stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="${-offset}"
        transform="rotate(-90 ${CX} ${CY})" stroke-linecap="butt" />`;
      offset += len;
    });

    svgContent += `<text x="${CX}" y="${CY - 4}" text-anchor="middle" font-size="20" font-weight="900" fill="#1F2430">${fmtNum(topSum)}</text>`;
    svgContent += `<text x="${CX}" y="${CY + 16}" text-anchor="middle" font-size="10" fill="#767C8C">상위 ${top.length}개 합계</text>`;
    svg.innerHTML = svgContent;

    const legendEl = document.getElementById(legendId);
    legendEl.innerHTML = segments.map((seg) => {
      const pct = totalCount > 0 ? ((seg.count / totalCount) * 100).toFixed(1) : "0.0";
      return `<div class="legend-row">
        <span class="dot" style="background:${seg.color}"></span>
        <span class="legend-name">${escapeHtml(seg.name)}</span>
        <span class="legend-count">${fmtNum(seg.count)}건</span>
        <span class="legend-pct">${pct}%</span>
      </div>`;
    }).join("");
  }

  function buildDonut(topCountries, totalCount) {
    const top5 = topCountries.slice(0, 5);
    const top5Sum = top5.reduce((s, c) => s + c.count, 0);
    const otherCount = Math.max(totalCount - top5Sum, 0);

    const segments = top5.map((c, i) => ({ name: c.name, count: c.count, color: COLOR_HEX[i] }));
    if (otherCount > 0) segments.push({ name: "기타", count: otherCount, color: OTHER_HEX });

    // SVG donut (stroke-dasharray 트릭)
    const svg = document.getElementById("donut");
    const R = 60, CX = 75, CY = 75, STROKE = 18;
    const circumference = 2 * Math.PI * R;
    let offset = 0;
    let svgContent = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#EEF0F4" stroke-width="${STROKE}" />`;

    segments.forEach((seg) => {
      const frac = totalCount > 0 ? seg.count / totalCount : 0;
      const len = frac * circumference;
      svgContent += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${seg.color}" stroke-width="${STROKE}"
        stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="${-offset}"
        transform="rotate(-90 ${CX} ${CY})" stroke-linecap="butt" />`;
      offset += len;
    });

    svg.innerHTML = svgContent;

    // 중앙 라벨 (foreignObject 대신 별도 absolute 텍스트로 처리하기 위해 부모에 relative wrap 필요 -> 간단히 text로)
    svgContent += `<text x="${CX}" y="${CY - 4}" text-anchor="middle" font-size="20" font-weight="900" fill="#1F2430">${fmtNum(totalCount)}</text>`;
    svgContent += `<text x="${CX}" y="${CY + 16}" text-anchor="middle" font-size="10" fill="#767C8C">총 등록</text>`;
    svg.innerHTML = svgContent;

    const legendEl = document.getElementById("legend");
    legendEl.innerHTML = segments.map((seg) => {
      const pct = totalCount > 0 ? ((seg.count / totalCount) * 100).toFixed(1) : "0.0";
      return `<div class="legend-row">
        <span class="dot" style="background:${seg.color}"></span>
        <span class="legend-name">${escapeHtml(seg.name)}</span>
        <span class="legend-count">${fmtNum(seg.count)}건</span>
        <span class="legend-pct">${pct}%</span>
      </div>`;
    }).join("");

    return segments;
  }

  function buildYearChart(items, countrySegments) {
    const topCountryNames = countrySegments.filter((s) => s.name !== "기타").map((s) => s.name);
    const colorByCountry = {};
    countrySegments.forEach((s) => { colorByCountry[s.name] = s.color; });

    const yearMap = new Map(); // year -> { total, byCountry: {country: count} }
    for (const it of items) {
      const y = getYear(it.DMF_PERMIT_DATE);
      if (!y) continue;
      if (!yearMap.has(y)) yearMap.set(y, { total: 0, byCountry: {} });
      const entry = yearMap.get(y);
      entry.total += 1;
      const countries = (it.MANUF_COUNTRY_CODE_NM ?? "").split(",").map((s) => s.trim()).filter(Boolean);
      for (const c of countries) {
        const key = topCountryNames.includes(c) ? c : "기타";
        entry.byCountry[key] = (entry.byCountry[key] ?? 0) + 1;
      }
    }

    const years = [...yearMap.keys()].sort((a, b) => b.localeCompare(a)).slice(0, 6);
    const maxTotal = Math.max(...years.map((y) => yearMap.get(y).total), 1);

    const listEl = document.getElementById("year-list");
    if (years.length === 0) {
      listEl.innerHTML = `<div class="empty-state">연도 데이터 없음</div>`;
      return;
    }

    listEl.innerHTML = years.map((y) => {
      const entry = yearMap.get(y);
      const widthPct = (entry.total / maxTotal) * 100;
      const segs = [...topCountryNames, "기타"]
        .filter((c) => entry.byCountry[c])
        .map((c) => {
          const segWidth = (entry.byCountry[c] / entry.total) * 100;
          return `<div class="year-bar-seg" style="width:${segWidth}%;background:${colorByCountry[c] ?? OTHER_HEX}"></div>`;
        }).join("");

      return `<div class="year-row">
        <div class="year-label">${y}년</div>
        <div class="year-bar-track" style="width:${widthPct}%">${segs}</div>
        <div class="year-count">${fmtNum(entry.total)}</div>
      </div>`;
    }).join("");
  }

  function buildPills(topCountries) {
    const names = ["전체", ...topCountries.slice(0, 4).map((c) => c.name)];
    const pillsEl = document.getElementById("pills");
    pillsEl.innerHTML = names.map((n) => {
      const count = n === "전체"
        ? allItems.length
        : topCountries.find((c) => c.name === n)?.count ?? 0;
      return `<button class="pill ${n === activeCountry ? "active" : ""}" data-country="${escapeHtml(n)}">${escapeHtml(n)} ${fmtNum(count)}</button>`;
    }).join("");

    pillsEl.querySelectorAll(".pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeCountry = btn.dataset.country;
        pillsEl.querySelectorAll(".pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const searchInput = document.getElementById("search");
        searchInput.value = activeCountry === "전체" ? "" : activeCountry;
        applySearch();
      });
    });
  }

  function todayDigitsKST() {
    const now = new Date();
    const kst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
    const y = kst.getFullYear();
    const m = String(kst.getMonth() + 1).padStart(2, "0");
    const d = String(kst.getDate()).padStart(2, "0");
    return `${y}${m}${d}`;
  }

  function normalizeDateDigits(s) { return String(s ?? "").replace(/[^0-9]/g, ""); }

  function parseYYYYMMDD(s) {
    const digits = normalizeDateDigits(s);
    if (digits.length !== 8) return null;
    const y = Number(digits.slice(0, 4));
    const m = Number(digits.slice(4, 6));
    const d = Number(digits.slice(6, 8));
    if (!y || !m || !d) return null;
    return Date.UTC(y, m - 1, d);
  }

  function todayUTCFromKST() {
    const now = new Date();
    const kst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
    return Date.UTC(kst.getFullYear(), kst.getMonth(), kst.getDate());
  }

  function fmtYMD(ts) {
    const d = new Date(ts);
    return `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, "0")}.${String(d.getUTCDate()).padStart(2, "0")}`;
  }

  function buildStatCards(data) {
    const MS_DAY = 86400000;
    const todayTs = todayUTCFromKST();
    const cutoffTs = todayTs - 6 * MS_DAY; // 오늘 포함 7일

    const recentCount = allItems.filter((it) => {
      const ts = parseYYYYMMDD(it.DMF_PERMIT_DATE);
      return ts !== null && ts >= cutoffTs && ts <= todayTs;
    }).length;

    const cards = [
      { icon: "📄", iconBg: "#E4F5EC", iconColor: "#2F9E63", label: "전체 등록건수", value: fmtNum(data.totalCount), sub: "누적 기준" },
      { icon: "🏢", iconBg: "#E7ECFF", iconColor: "#4C6FE0", label: "등록업체 수", value: fmtNum(data.summary.uniqueCompanies), sub: "고유 업체 기준" },
      { icon: "🌍", iconBg: "#FBF0DD", iconColor: "#B9862B", label: "제조국가 수", value: fmtNum(data.summary.uniqueCountries), sub: "고유 국가 기준" },
      { icon: "📅", iconBg: "#FBE8E7", iconColor: "#E2574C", label: "최근 7일 등록 건수", value: fmtNum(recentCount), sub: `${fmtYMD(cutoffTs)} ~ ${fmtYMD(todayTs)}` },
    ];

    document.getElementById("stat-grid").innerHTML = cards.map((c) => `
      <div class="stat-card">
        <div class="stat-head">
          <div class="stat-icon" style="background:${c.iconBg};color:${c.iconColor}">${c.icon}</div>
          <div class="stat-label">${c.label}</div>
        </div>
        <div class="stat-value">${c.value}</div>
        <div class="stat-sub">${c.sub}</div>
      </div>
    `).join("");
  }

  function renderTable(items) {
    const body = document.getElementById("table-body");
    const countText = `${fmtNum(items.length)}건 표시`;
    document.getElementById("row-count").textContent = countText;
    document.getElementById("row-count-top").textContent = countText;

    if (items.length === 0) {
      body.innerHTML = `<tr><td colspan="5"><div class="empty-state">검색 결과가 없습니다</div></td></tr>`;
      return;
    }

    const slice = items.slice(0, 500); // 렌더링 성능 보호
    body.innerHTML = slice.map((it) => `<tr>
      <td>${escapeHtml(it.DMF_PERMIT_NO)}</td>
      <td>${escapeHtml(it.INGR_KOR_NAME)}</td>
      <td>${escapeHtml(it.ENTP_NAME)}</td>
      <td>${escapeHtml(it.MANUF_COUNTRY_CODE_NM)}</td>
      <td>${escapeHtml(it.DMF_PERMIT_DATE)}</td>
    </tr>`).join("");
  }

  function applySearch() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    if (!q) { renderTable(allItems); return; }
    const filtered = allItems.filter((it) =>
      [it.INGR_KOR_NAME, it.ENTP_NAME, it.MANUF_COUNTRY_CODE_NM, it.DMF_PERMIT_NO]
        .some((f) => (f ?? "").toLowerCase().includes(q))
    );
    renderTable(filtered);
  }

  async function init() {
    try {
      const res = await fetch("./data/latest.json", { cache: "no-store" });
      const data = await res.json();
      allItems = data.items ?? [];

      document.getElementById("updated-line").textContent = data.generatedAt
        ? `마지막 갱신: ${new Date(data.generatedAt).toLocaleString("ko-KR")}`
        : "아직 수집된 데이터가 없습니다";
      document.getElementById("right-total").textContent = fmtNum(data.totalCount);

      const segments = buildDonut(data.summary.topCountries, data.totalCount);
      buildYearChart(allItems, segments);
      buildPills(data.summary.topCountries);
      buildStatCards(data, segments);
      renderRankDonut("donut-company", "legend-company", data.summary.topCompanies, data.totalCount, RANK_COLORS);
      renderRankDonut("donut-country10", "legend-country10", data.summary.topCountries, data.totalCount, RANK_COLORS);
      renderTable(allItems);

      document.getElementById("search").addEventListener("input", () => {
        activeCountry = "전체는 아님";
        document.querySelectorAll(".pill").forEach((b) => b.classList.remove("active"));
        applySearch();
      });
    } catch (err) {
      document.getElementById("updated-line").textContent = "데이터를 불러오지 못했습니다";
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
